<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Connect Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/sdk@2.0.3/dist/tonconnect-sdk.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #FFD700;
        }
        h1 {
            color: #FFD700;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 40px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #444, #222);
            color: #fff;
        }
        .status {
            background: #0a0a0a;
            border-radius: 16px;
            padding: 12px;
            margin-top: 16px;
            font-size: 12px;
            word-break: break-all;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .success { color: #00ff66; }
        .error { color: #ff4444; }
        .info { color: #FFD700; }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: #FFD700;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        pre {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 11px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 TON Connect Test</h1>
        
        <button class="btn" id="initBtn">📦 1. Инициализировать SDK</button>
        <button class="btn" id="connectBtn" disabled>🔗 2. Подключить кошелёк</button>
        <button class="btn" id="sendBtn" disabled>💸 3. Отправить тестовую транзакцию</button>
        <button class="btn btn-secondary" id="disconnectBtn" disabled>❌ Отключить кошелёк</button>
        
        <div class="status" id="status">
            <span id="statusText">⚡ Ожидание действий...</span>
        </div>
        
        <div id="log" style="margin-top: 16px;"></div>
    </div>

    <script>
        // Константы для теста (используем тестовый кошелёк)
        const TEST_WALLET = 'UQCEA1RKJ0eAZ_kvpN7tzhrCIh94XBw9ROSeQbaHPXOEOPRP';
        const MANIFEST_URL = 'https://dadton.onrender.com/tonconnect-manifest.json';
        
        let tonConnector = null;
        let isConnected = false;
        let userWallet = null;
        
        // Логирование в UI
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const color = type === 'success' ? '#00ff66' : (type === 'error' ? '#ff4444' : '#FFD700');
            const entry = document.createElement('div');
            entry.style.cssText = `color: ${color}; margin-bottom: 8px; font-size: 12px; border-bottom: 1px solid #333; padding-bottom: 4px;`;
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            // Также обновляем статус
            const statusSpan = document.getElementById('statusText');
            if (type === 'error') statusSpan.innerHTML = `❌ ${message}`;
            else if (type === 'success') statusSpan.innerHTML = `✅ ${message}`;
            else statusSpan.innerHTML = `🔄 ${message}`;
        }
        
        function updateButtons() {
            const connectBtn = document.getElementById('connectBtn');
            const sendBtn = document.getElementById('sendBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const initBtn = document.getElementById('initBtn');
            
            if (tonConnector && isConnected) {
                connectBtn.disabled = true;
                sendBtn.disabled = false;
                disconnectBtn.disabled = false;
                initBtn.disabled = true;
            } else if (tonConnector && !isConnected) {
                connectBtn.disabled = false;
                sendBtn.disabled = true;
                disconnectBtn.disabled = true;
                initBtn.disabled = true;
            } else {
                connectBtn.disabled = true;
                sendBtn.disabled = true;
                disconnectBtn.disabled = true;
                initBtn.disabled = false;
            }
        }
        
        // 1. Инициализация SDK
        document.getElementById('initBtn').onclick = function() {
            addLog('Инициализация TON Connect SDK...', 'info');
            
            // Проверяем загрузку библиотеки
            if (typeof TonConnectSDK === 'undefined') {
                addLog('❌ Ошибка: TonConnectSDK не загружен! Проверьте интернет.', 'error');
                return;
            }
            
            try {
                tonConnector = new TonConnectSDK({
                    manifestUrl: MANIFEST_URL
                });
                
                addLog('✅ SDK инициализирован', 'success');
                addLog(`Манифест URL: ${MANIFEST_URL}`, 'info');
                
                // Подписываемся на изменения статуса
                tonConnector.onStatusChange((wallet) => {
                    if (wallet) {
                        isConnected = true;
                        userWallet = wallet;
                        addLog(`✅ Кошелёк подключён! Адрес: ${wallet.account.address.slice(0,6)}...${wallet.account.address.slice(-4)}`, 'success');
                        updateButtons();
                    } else {
                        isConnected = false;
                        userWallet = null;
                        addLog(`🔓 Кошелёк отключён`, 'info');
                        updateButtons();
                    }
                });
                
                // Проверяем, был ли уже подключён кошелёк
                tonConnector.restoreConnection().then(() => {
                    addLog('🔄 Проверка сохранённого подключения...', 'info');
                });
                
                updateButtons();
                
            } catch(e) {
                addLog(`❌ Ошибка инициализации: ${e.message}`, 'error');
                console.error(e);
            }
        };
        
        // 2. Подключение кошелька
        document.getElementById('connectBtn').onclick = async function() {
            if (!tonConnector) {
                addLog('❌ Сначала инициализируйте SDK (кнопка 1)', 'error');
                return;
            }
            
            addLog('🔍 Получение списка доступных кошельков...', 'info');
            
            try {
                const wallets = await tonConnector.getWallets();
                addLog(`📱 Найдено кошельков: ${wallets.length}`, 'success');
                
                wallets.forEach(w => {
                    addLog(`   - ${w.name} (${w.bridgeUrl ? 'bridge OK' : 'no bridge'})`, 'info');
                });
                
                if (!wallets || wallets.length === 0) {
                    addLog('❌ Кошельки не найдены. Установите Tonkeeper или другой TON кошелёк.', 'error');
                    return;
                }
                
                // Ищем Tonkeeper или берём первый
                const preferred = wallets.find(w => w.name === 'Tonkeeper') || wallets[0];
                addLog(`🔗 Подключение к ${preferred.name}...`, 'info');
                
                try {
                    // Пробуем подключиться
                    await tonConnector.connect({
                        bridgeUrl: preferred.bridgeUrl,
                        universalLink: preferred.universalLink
                    });
                    addLog('✅ Запрос на подключение отправлен! Откройте кошелёк и подтвердите.', 'success');
                } catch (connectError) {
                    addLog(`⚠️ Ошибка при подключении через bridge: ${connectError.message}`, 'error');
                    addLog('🔄 Пробуем альтернативный способ...', 'info');
                    await tonConnector.connect();
                }
                
            } catch(e) {
                addLog(`❌ Ошибка подключения: ${e.message}`, 'error');
                console.error(e);
            }
        };
        
        // 3. Отправка тестовой транзакции
        document.getElementById('sendBtn').onclick = async function() {
            if (!tonConnector || !isConnected) {
                addLog('❌ Сначала подключите кошелёк', 'error');
                return;
            }
            
            const amount = 0.1; // 0.1 TON для теста
            const nanoAmount = Math.floor(amount * 1e9);
            const comment = `test_${Date.now()}`;
            
            addLog(`💸 Подготовка транзакции: ${amount} TON`, 'info');
            addLog(`📝 Комментарий: ${comment}`, 'info');
            addLog(`🏦 Получатель: ${TEST_WALLET.slice(0,6)}...${TEST_WALLET.slice(-4)}`, 'info');
            
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 300, // 5 минут
                messages: [{
                    address: TEST_WALLET,
                    amount: nanoAmount.toString(),
                    payload: comment
                }]
            };
            
            try {
                addLog('⏳ Отправка транзакции в кошелёк...', 'info');
                const result = await tonConnector.sendTransaction(transaction);
                addLog(`✅ Транзакция отправлена!`, 'success');
                addLog(`📦 Результат: ${JSON.stringify(result).slice(0, 200)}`, 'info');
            } catch(e) {
                addLog(`❌ Ошибка отправки: ${e.message}`, 'error');
                console.error(e);
            }
        };
        
        // Отключение кошелька
        document.getElementById('disconnectBtn').onclick = async function() {
            if (tonConnector) {
                await tonConnector.disconnect();
                addLog('🔌 Кошелёк отключён', 'info');
                updateButtons();
            }
        };
        
        // Автоматическая инициализация при загрузке страницы
        setTimeout(() => {
            addLog('💡 Нажмите кнопку "Инициализировать SDK" для начала', 'info');
            addLog(`🌐 Манифест URL: ${MANIFEST_URL}`, 'info');
            
            // Проверяем доступность манифеста
            fetch(MANIFEST_URL)
                .then(res => res.json())
                .then(data => addLog(`✅ Манифест доступен: ${JSON.stringify(data)}`, 'success'))
                .catch(err => addLog(`❌ Манифест недоступен: ${err.message}. Проверьте URL.`, 'error'));
        }, 500);
    </script>
</body>
</html>
