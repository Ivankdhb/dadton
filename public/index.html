<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Connect Test</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #FFD700;
        }
        h1 {
            color: #FFD700;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 40px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .status {
            background: #0a0a0a;
            border-radius: 16px;
            padding: 12px;
            margin-top: 16px;
            font-size: 12px;
            word-break: break-all;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .success { color: #00ff66; }
        .error { color: #ff4444; }
        .info { color: #FFD700; }
        #log {
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 TON Connect Test</h1>
        
        <div id="ton-connect-button"></div>
        
        <button class="btn" id="sendBtn" disabled style="margin-top: 16px;">💸 Отправить 0.1 TON</button>
        
        <div class="status" id="status">
            <span id="statusText">⚡ Ожидание подключения...</span>
        </div>
        
        <div id="log" style="margin-top: 16px;"></div>
    </div>

    <script>
        const TEST_WALLET = 'UQCEA1RKJ0eAZ_kvpN7tzhrCIh94XBw9ROSeQbaHPXOEOPRP';
        const MANIFEST_URL = 'https://dadton.onrender.com/tonconnect-manifest.json';
        
        let tonConnectUI = null;
        let isConnected = false;
        
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const color = type === 'success' ? '#00ff66' : (type === 'error' ? '#ff4444' : '#FFD700');
            const entry = document.createElement('div');
            entry.style.cssText = `color: ${color}; margin-bottom: 6px; font-size: 11px; border-bottom: 1px solid #333; padding-bottom: 3px;`;
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            const statusSpan = document.getElementById('statusText');
            if (type === 'error') statusSpan.innerHTML = `❌ ${message}`;
            else if (type === 'success') statusSpan.innerHTML = `✅ ${message}`;
            else statusSpan.innerHTML = `🔄 ${message}`;
        }
        
        // Инициализация TonConnectUI
        async function initTonConnect() {
            addLog('Инициализация TON Connect UI...', 'info');
            
            if (typeof TonConnectUI === 'undefined') {
                addLog('❌ TonConnectUI не загружен!', 'error');
                return false;
            }
            
            try {
                tonConnectUI = new TonConnectUI({
                    manifestUrl: MANIFEST_URL,
                    buttonRootId: 'ton-connect-button'
                });
                
                addLog('✅ UI инициализирован', 'success');
                
                // Подписка на изменения статуса
                tonConnectUI.onStatusChange((wallet) => {
                    if (wallet) {
                        isConnected = true;
                        addLog(`✅ Кошелёк подключён! Адрес: ${wallet.account.address.slice(0,6)}...${wallet.account.address.slice(-4)}`, 'success');
                        document.getElementById('sendBtn').disabled = false;
                    } else {
                        isConnected = false;
                        addLog(`🔓 Кошелёк отключён`, 'info');
                        document.getElementById('sendBtn').disabled = true;
                    }
                });
                
                return true;
            } catch(e) {
                addLog(`❌ Ошибка: ${e.message}`, 'error');
                return false;
            }
        }
        
        // Отправка транзакции
        async function sendPayment() {
            if (!tonConnectUI || !isConnected) {
                addLog('❌ Кошелёк не подключён', 'error');
                return;
            }
            
            const amount = 0.1;
            const nanoAmount = Math.floor(amount * 1e9);
            
            addLog(`💸 Создание транзакции: ${amount} TON`, 'info');
            
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 600,
                messages: [{
                    address: TEST_WALLET,
                    amount: nanoAmount.toString(),
                    payload: `test_${Date.now()}`
                }]
            };
            
            try {
                addLog('⏳ Отправка в кошелёк...', 'info');
                const result = await tonConnectUI.sendTransaction(transaction);
                addLog(`✅ Транзакция отправлена! Хэш: ${result.boc?.slice(0, 30)}...`, 'success');
            } catch(e) {
                addLog(`❌ Ошибка: ${e.message}`, 'error');
            }
        }
        
        // Кнопка отправки
        document.getElementById('sendBtn').onclick = sendPayment;
        
        // Запуск
        setTimeout(() => {
            initTonConnect();
        }, 500);
    </script>
</body>
</html>
